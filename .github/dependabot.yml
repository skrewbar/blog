version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    # Security updates only: 0 disables version-update PRs, but security
    # updates (enabled in repo settings) ignore this limit and still open.
    # This block stays so those PRs keep the commit prefix below.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "⬆️ "

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    commit-message:
      prefix: "⬆️ "
